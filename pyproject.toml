[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-work"
version = "0.1.0"
description = "Upwork for agents: hire an agent for a job instead of a freelancer"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
agent-work = "agent_work.__main__:main"

[tool.setuptools]
packages = ["agent_work"]
